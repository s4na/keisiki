name: PostgreSQL schedule replay

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dst-postgres-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_PASSWORD: keisiki-ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - name: Replay one schedule on PostgreSQL and compare outcomes
        env:
          KEISIKI_DST_DATABASE_URL: postgresql://postgres:keisiki-ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: |
          gem install pg --version 1.7.0 --no-document
          mkdir -p tmp/dst
          baseline_exit=0
          stale_read_exit=0
          ruby experiments/dst/postgres_replay.rb baseline > tmp/dst/baseline.json || baseline_exit=$?
          ruby experiments/dst/postgres_replay.rb stale_read > tmp/dst/stale_read.json || stale_read_exit=$?

          {
            printf '%s\n' '### P3 — PostgreSQL schedule replay' '' \
              '| Variant | Outcome | Committed reservations | Stock | Duration (ms) |' \
              '| --- | --- | --- | ---: | ---: |'
            jq -r '[.variant, .status, ((.committed_reservations // []) | join(", ")), (.stock // "—"), .duration_ms] | "| " + join(" | ") + " |"' \
              tmp/dst/baseline.json tmp/dst/stale_read.json
            printf '\n%s\n' 'Scope: one schedule, two PostgreSQL sessions at READ COMMITTED, initial stock 1. Evidence: dst-postgres-replay artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

          test "$baseline_exit" = 0
          test "$stale_read_exit" = 1
          jq -e '.status == "passed" and .stock == 0 and .committed_reservations == ["A"] and
            [.steps[].event] == ["stock_read_for_update", "stock_read_dispatched", "blocked_by_a_before_a_commit",
              "committed", "stock_read_taken", "rolled_back_insufficient_stock"] and .steps[4].stock == 0' \
            tmp/dst/baseline.json
          jq -e '.status == "contract_violation" and .stock == 0 and .committed_reservations == ["A", "B"] and
            .violations == ["at_most_one_committed_reservation"] and
            [.steps[].event] == ["stock_read_for_update", "stock_read_dispatched", "stock_read_completed_before_a_commit",
              "committed", "stock_read_taken", "committed"] and .steps[4].stock == 1' \
            tmp/dst/stale_read.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dst-postgres-replay
          path: tmp/dst/*.json
          if-no-files-found: error
