name: Reservation retry model check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  model-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned TLC build
        run: |
          tla_jar="$RUNNER_TEMP/tla2tools.jar"
          curl --fail --location --silent --show-error --retry 3 --max-time 60 \
            https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar \
            --output "$tla_jar"
          printf '%s  %s\n' fdffef247f563ef6edbfd44958d2a82db79e7564e07cb673262d896353fa6713 "$tla_jar" | sha256sum --check
          printf 'TLA2TOOLS_JAR=%s\n' "$tla_jar" >> "$GITHUB_ENV"
      - name: Check the finite model and its positive control
        run: |
          artifacts="$RUNNER_TEMP/reservation-retry-model"
          bin/check-reservation-retry-model "$artifacts"
          {
            printf '%s\n' '### 再送の有限モデル検査' '' \
              '在庫２個、予約 ID １種、数量１個、コミット後の応答喪失と再送１回。' '' \
              '| 性質 | 方式 | 不具合 | 検出結果 | 確認範囲 | 実行時間 |' \
              '| --- | --- | --- | --- | --- | ---: |'
            jq -r '"| P1 | TLC | 正常対照 | 違反なし | 到達可能な \(.normal.states_checked) 状態 | \(.normal.elapsed_seconds) 秒 |",
              "| P1 | TLC | 再送時の二重更新 | 検出 | 反例 \(.double_update.transitions) 遷移、残在庫 \(.double_update.final_stock) 個 | \(.double_update.elapsed_seconds) 秒 |"' "$artifacts/result.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reservation-retry-model
          path: ${{ runner.temp }}/reservation-retry-model
          if-no-files-found: error
