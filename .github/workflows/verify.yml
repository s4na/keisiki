name: Rails verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3
          z3 --version
      - name: Check Rails requests, proof, and counterexample replay
        run: bundle exec ruby test/smoke.rb
